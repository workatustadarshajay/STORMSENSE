site_name: StormSense
site_description: Weather-driven demand forecasts and store-to-store transfers, for store planners and the people who build them.
site_url: https://workatustadarshajay.github.io/STORMSENSE/docs/
repo_url: https://github.com/workatustadarshajay/STORMSENSE
repo_name: STORMSENSE
edit_uri: edit/main/docs/

docs_dir: docs
# The architecture diagrams are built into the same Pages site at /architecture/ (see infra/build_architecture_site.py).
exclude_docs: |
  architecture/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - For planners:
      - Planner guide: planner-guide.md
      - Five-minute demo: demo-script.md
  - Getting started:
      - Run it on your machine: running-locally.md
      - How to check it works: how-to-verify.md
  - How it works:
      - System design: system-design.md
      - Forecasting method: forecasting.md
      - Data dictionary: data-dictionary.md
  - Integrations:
      - MCP server and client: integrations/mcp.md
      - API reference: api-reference.md
  - Operations:
      - Runbook: runbook.md
      - Go-live checklist: go-live.md

extra:
  generator: false
