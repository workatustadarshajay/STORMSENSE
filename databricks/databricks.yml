# Data and forecasting side of StormSense: tables, forecaster and the daily job.
# Deploy with `make deploy-data` (see docs/runbook.md). The app has its own bundle in backend/.
bundle:
  name: stormsense-data

variables:
  catalog:
    description: Unity Catalog catalog that holds the StormSense schema.
    default: workspace
  schema:
    description: Schema that holds every StormSense table.
    default: stormsense
  warehouse_id:
    description: SQL warehouse that runs the dashboard.
    default: "52140806e6c8212a"
  weather_provider:
    description: "nws (default) for the live US National Weather Service forecast, or sample for generated weather."
    default: nws
  alert_email:
    description: "Address that receives StormSense job emails. Give it at deploy time with --var alert_email=... so the address stays out of the repository."
    default: ""
  trigger_status:
    description: UNPAUSED to watch for new storm warnings every 15 minutes, PAUSED to stop spending compute.
    default: PAUSED
  schedule_status:
    description: UNPAUSED to run every morning, PAUSED to stop spending compute.
    default: UNPAUSED

sync:
  include:
    - stormsense_core/**
    - notebooks/**
    - pipelines/**
    - dashboards/**
  exclude:
    - "**/__pycache__/**"

include:
  - resources/*.yml

targets:
  default:
    default: true
