resources:
  jobs:
    stormsense_storm_trigger:
      name: StormSense - Storm trigger (NWS warnings)
      description: Every 15 minutes, checks official NWS warnings for Florida, Texas and California. A new plan-changing warning starts the daily cycle once. Paused by default.
      max_concurrent_runs: 1
      tags:
        project: stormsense
      timeout_seconds: 900
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: UTC
        pause_status: "${var.trigger_status}"
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${var.schema}" }
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      environments:
        - environment_key: default
          spec:
            client: "4"
      tasks:
        - task_key: check_warnings
          disable_auto_optimization: true
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/13_storm_trigger.py
    stormsense_build:
      name: StormSense - Build data and forecaster
      description: Creates the tables, sample data and forecaster, then runs the daily cycle once. Safe to re-run.
      max_concurrent_runs: 1
      tags:
        project: stormsense
      environments:
        - environment_key: default
          spec:
            client: "4"
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${var.schema}" }
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      tasks:
        - task_key: setup
          disable_auto_optimization: true
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_setup.py
        - task_key: sample_data
          disable_auto_optimization: true
          depends_on: [{ task_key: setup }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_sample_data.py
        - task_key: data_quality
          disable_auto_optimization: true
          depends_on: [{ task_key: sample_data }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.stormsense_quality.id}
        - task_key: features
          disable_auto_optimization: true
          depends_on: [{ task_key: data_quality }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_features.py
        - task_key: train_register
          disable_auto_optimization: true
          depends_on: [{ task_key: features }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/04_train_register.py
        - task_key: score
          disable_auto_optimization: true
          depends_on: [{ task_key: train_register }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/06_score.py
        - task_key: gaps
          disable_auto_optimization: true
          depends_on: [{ task_key: score }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/07_gaps.py
        - task_key: learn_feedback
          disable_auto_optimization: true
          depends_on: [{ task_key: gaps }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/12_learn_from_feedback.py
        - task_key: recommendations
          disable_auto_optimization: true
          depends_on: [{ task_key: learn_feedback }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/08_recommendations.py
        - task_key: verify
          disable_auto_optimization: true
          depends_on: [{ task_key: recommendations }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/09_verify.py
            base_parameters:
              mode: build
        - task_key: cost_view
          depends_on: [{ task_key: verify }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/11_cost_view.py
        - task_key: backtest
          disable_auto_optimization: true
          depends_on: [{ task_key: sample_data }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/14_backtest.py

    stormsense_daily:
      name: StormSense - Daily forecast and transfers
      description: Every morning at 6:00 AM Eastern - refresh weather, rebuild features, forecast, find gaps, recommend transfers, verify.
      max_concurrent_runs: 1
      tags:
        project: stormsense
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/New_York
        pause_status: "${var.schedule_status}"
      queue:
        enabled: true
      environments:
        - environment_key: default
          spec:
            client: "4"
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${var.schema}" }
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: refresh_weather
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/05_refresh_weather.py
            base_parameters:
              provider: "${var.weather_provider}"
        - task_key: data_quality
          pipeline_task:
            pipeline_id: ${resources.pipelines.stormsense_quality.id}
        - task_key: features
          depends_on: [{ task_key: refresh_weather }, { task_key: data_quality }]
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/03_features.py
        - task_key: score
          depends_on: [{ task_key: features }]
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/06_score.py
        - task_key: gaps
          depends_on: [{ task_key: score }]
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/07_gaps.py
        - task_key: learn_feedback
          depends_on: [{ task_key: gaps }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/12_learn_from_feedback.py
        - task_key: learn_feedback
          depends_on: [{ task_key: gaps }]
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/12_learn_from_feedback.py
        - task_key: recommendations
          depends_on: [{ task_key: learn_feedback }]
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/08_recommendations.py
        - task_key: verify
          depends_on: [{ task_key: recommendations }]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/09_verify.py
            base_parameters:
              mode: daily

    stormsense_app_access:
      name: StormSense - Grant app access
      description: Gives the app's service principal read access to the tables and write access to transfer decisions only.
      max_concurrent_runs: 1
      tags:
        project: stormsense
      environments:
        - environment_key: default
          spec:
            client: "4"
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${var.schema}" }
        - { name: app_service_principal, default: "" }
      tasks:
        - task_key: grants
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/10_grants.py
