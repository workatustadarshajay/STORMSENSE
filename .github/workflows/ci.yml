name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt -r databricks/requirements-dev.txt
      - run: ruff check databricks backend
      - run: python -m pytest databricks/tests backend -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    # The web app's types and the sample data must match the code that produces them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt -r databricks/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: |
          (cd backend && python scripts/export_openapi.py ../frontend/openapi.json)
          (cd frontend && npm run types)
          python databricks/scripts/make_fixtures.py
          python -c "import sys; sys.path.insert(0, 'databricks'); from stormsense_core.tables import data_dictionary; print(data_dictionary())" > docs/data-dictionary.md
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts backend/app/fixtures.json docs/data-dictionary.md

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build && rm -rf ../backend/static && cp -r dist ../backend/static && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "1"
